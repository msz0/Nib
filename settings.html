/* Monochrome editorial settings */
:root{--bg:#070707;--card:#111;--line:#292929;--ac:#f2f2f2;--cal-ink:#f1f1f1;--cal-muted:#a1a1a1;--cal-green:var(--ac);--cal-surface:#0c0c0c;--cal-line:#333;--settings-surface:#111;--settings-raised:#171717;--settings-input:#0b0b0b;--settings-text:#f2f2f2;--settings-muted:#a3a3a3;--settings-dim:#777;--settings-line:#2b2b2b;color-scheme:dark}
html,body{scrollbar-color:#555 transparent;scrollbar-width:thin}
body{background:radial-gradient(ellipse at 86% 0,#1b1b1b 0,transparent 36%),linear-gradient(145deg,var(--bg),#0b0b0b 72%);color:var(--settings-text);font-family:"Segoe UI Variable Text","Segoe UI",sans-serif}
#side{width:205px;padding:24px 12px 18px;background:rgba(8,8,8,.82);border-right:1px solid var(--settings-line);backdrop-filter:blur(16px)}
#side .brand{position:relative;gap:12px;align-items:center;margin:0 6px 12px;padding:5px 8px 18px;border-bottom:1px solid var(--settings-line);font:500 17px/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.25px}
#side .brand-mark{display:block;width:36px;height:36px;flex:none;border:1px solid #ffffff35;border-radius:11px}
#side .brand small{margin-top:5px;color:var(--settings-muted);font:600 9px "Cascadia Mono",Consolas,monospace;letter-spacing:.13em;text-transform:uppercase}
.nav-search{position:relative;display:flex;align-items:center;margin:5px 5px 14px;padding:0 11px;height:40px;border:1px solid var(--settings-line);border-radius:11px;background:var(--settings-input);color:var(--settings-dim)}
.nav-search svg{flex:none}.nav-search input{width:100%;min-width:0;height:38px;padding:0 0 0 9px;border:0;background:transparent;color:var(--settings-text);font:12px "Segoe UI Variable Text","Segoe UI",sans-serif;outline:0}
.nav-search input::placeholder{color:var(--settings-dim)}
.nav-groups{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#444 transparent}
.nav-group{margin-bottom:13px}
.nav-label{padding:0 11px 5px;color:var(--settings-dim);font:600 9px "Cascadia Mono",Consolas,monospace;letter-spacing:.13em;text-transform:uppercase}
.ni{position:relative;width:100%;height:43px;margin:2px 0;padding:0 12px;border:1px solid transparent;border-radius:11px;color:var(--settings-muted);font:500 13px "Segoe UI Variable Text","Segoe UI",sans-serif;transition:background .18s,color .18s,border-color .18s,transform .18s}
.ni:hover{transform:translateX(2px);background:#ffffff0b;color:var(--settings-text)}
.ni.on{border-color:#ffffff1a;background:#f2f2f2;color:#111}
.ni.on::before{content:"";position:absolute;left:-12px;top:10px;width:2px;height:18px;border-radius:0 2px 2px 0;background:var(--ac)}
.nav-empty{margin:8px 10px;color:var(--settings-muted);font-size:12px}
.nav-foot{padding:12px 10px 0;border-top:1px solid var(--settings-line);color:var(--settings-dim);font-size:10px}
#main{padding:44px 54px 64px;background:radial-gradient(ellipse at 94% 0,#ffffff05 0,transparent 34%);scrollbar-width:thin}
#main h1{color:var(--settings-text);font:500 34px/1.08 Georgia,"Times New Roman",serif;letter-spacing:-.7px}
#main .sub{margin:8px 0 30px;color:var(--settings-muted);font-size:13px;letter-spacing:.01em}
#main h3{margin:31px 0 12px;color:var(--settings-muted);font:600 10px "Cascadia Mono",Consolas,monospace;letter-spacing:.15em;text-transform:uppercase}
.card,.ac{border:1px solid var(--settings-line);border-radius:14px;background:linear-gradient(145deg,var(--settings-raised),var(--settings-surface));box-shadow:0 8px 22px #00000024}
.r{gap:16px;min-height:66px;padding:17px 19px;border-color:#ffffff0b}
.rt b{color:var(--settings-text);font-size:13px;font-weight:600;letter-spacing:.005em}
.rt small{color:var(--settings-muted);font-size:12px;line-height:1.5}
.seg button,.btn{height:36px;padding:0 15px;border:1px solid #333;border-radius:10px;background:var(--settings-input);color:#dedede;font:600 12px "Segoe UI Variable Text","Segoe UI",sans-serif;transition:background .18s,border-color .18s,color .18s,transform .18s}
.seg button:hover,.btn:hover{border-color:#888;background:#242424}
.seg button.on,.btn.on{border-color:var(--ac);background:var(--ac);color:#111}
.tg{border:0;background:#333}
.tg::after{background:#aaa}
.tg.on{background:var(--ac)}
.tg.on::after{background:#111}
.rg span{color:var(--settings-muted);font:10px "Cascadia Mono",Consolas,monospace}
input[type=text],input[type=email],input[type=password],select,textarea{border:1px solid #333;border-radius:9px;background:var(--settings-input);color:var(--settings-text);outline:none}
input[type=text]:focus,input[type=email]:focus,input[type=password]:focus,select:focus,textarea:focus{border-color:#aaa;box-shadow:0 0 0 3px #ffffff12}
input::placeholder,textarea::placeholder{color:var(--settings-dim)}
.ac{padding:19px 19px 17px;transition:border-color .18s,transform .18s,box-shadow .18s}
.ac:hover{transform:translateY(-1px);border-color:#666;box-shadow:0 12px 26px #0003}
.ac .ic{border:1px solid #ffffff18;border-radius:12px;background:#ffffff0a;color:#ddd}
.ac b{color:var(--settings-text);font-size:12px}
.ac .st{color:#eee;font:600 9px "Cascadia Mono",Consolas,monospace;letter-spacing:.035em;text-transform:uppercase}
.ac .st.off{color:var(--settings-dim)}
.ac p,.hint{color:var(--settings-muted);font-size:12px;line-height:1.55}
.arow{gap:7px;padding:9px 10px;border-color:#ffffff0b}
.arow .h,.ac .draghandle{color:#aaa}
.lg{color:#ddd}
.chips{gap:7px;padding:11px}
.apple-calendar{padding:26px;border-color:var(--cal-line);background:radial-gradient(ellipse at 92% 8%,#ffffff0d 0,transparent 42%),linear-gradient(145deg,#171717,#101010 72%);box-shadow:0 18px 40px #0003}
.apple-cal-title{font:500 26px/1.08 Georgia,"Times New Roman",serif;letter-spacing:-.45px}
.apple-cal-mark{border-color:#ffffff28;background:#ffffff0a;color:var(--cal-green)}
.apple-cal-field input{border-color:#3a3a3a;background:var(--cal-surface)}
.apple-cal-field input:focus{border-color:#aaa;box-shadow:0 0 0 3px #ffffff12}
.apple-cal-connect{border-color:var(--ac);background:var(--ac);color:#111}
.apple-cal-connect:hover{background:#fff}
.apple-cal-state.connected{border-color:#ffffff20;background:#ffffff09;color:#eee}
.apple-cal-dot{background:#666}
.apple-cal-state.connected .apple-cal-dot{background:var(--ac);box-shadow:0 0 0 3px #ffffff20}
.apple-cal-foot span::before{background:#aaa}
.apple-calendar button:focus-visible{outline-color:#fff}
#main a{color:var(--ac)}
button:focus-visible,.ni:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@keyframes settings-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#main>*{animation:settings-enter .24s ease both}
.nav-group,.nav-search,#main .card,#main .ac,#main .apple-calendar{transition:border-color .18s ease,background .18s ease,box-shadow .18s ease}
@media(max-width:900px){#side{width:225px}#main{padding:34px 30px 48px}.cards{grid-template-columns:1fr}}
@media(max-width:700px){#side{width:195px;padding:18px 9px}#main{padding:26px 20px 40px}#main h1{font-size:29px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

const PAGES = [['apps', 'Apps', 'apps'], ['island', 'Island', 'sliders'], ['music', 'Music', 'equalizer'], ['sounds', 'Sounds', 'chat'], ['launcher', 'Launcher', 'folder'], ['connect', 'Connections', 'claude'], ['general', 'General', 'sys']];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ico = (k, sz = 18) => { const I = C.icons; if (I.fill[k]) return `<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="currentColor"><path d="${I.fill[k].f}"/></svg>`; if (I.stroke[k]) return `<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${I.stroke[k]}</svg>`; return ''; };
const queue = () => { clearTimeout(saveT); saveT = setTimeout(() => { nib.setSettings(S).catch(e => console.error('[Nib settings] Save failed:',e)); }, 350); };

  ArrowLeft: 'Left', ArrowUp: 'Up', ArrowRight: 'Right', ArrowDown: 'Down', Backquote: '`', Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']', Backslash: '\\', Semicolon: ';', Quote: "'",
  Comma: ',', Period: '.', Slash: '/', CapsLock: 'CapsLock', ScrollLock: 'ScrollLock', Pause: 'Pause', PrintScreen: 'PrintScreen', NumpadAdd: 'NumAdd', NumpadSubtract: 'NumSub',
  NumpadMultiply: 'NumMul', NumpadDivide: 'NumDiv', NumpadDecimal: 'NumDec' };
const keyName = c => /^Key[A-Z]$/.test(c) ? c[3] : /^Digit\d$/.test(c) ? c[5] : /^F\d{1,2}$/.test(c) ? c : /^Numpad\d$/.test(c) ? 'Num' + c[6] : KN[c] || '';
const keyrec = (get, set, ph) => {
  const w = mk('div'), i = mk('input'), b = mk('button', 'btn', 'Record'), x = mk('button', 'btn mini', '\u2715');
  w.style.cssText = 'display:flex;gap:6px;align-items:center'; x.title = 'Clear';
  i.type = 'text'; i.value = get() || ''; i.placeholder = ph || ''; i.style.minWidth = '150px';
  i.onchange = () => { set(i.value.trim()); queue(); };

function appleCalendarPanel() {

    <div class="apple-cal-copy"><div class="apple-cal-eyebrow">APPLE CALENDAR / PUBLIC LINK</div><h2 class="apple-cal-title">Your week, in one quiet place.</h2><p>Paste a public iCloud calendar link. Nib reads the events directly; no Apple ID sign-in or password is needed.</p></div>
    <div class="apple-cal-state" role="status"><i class="apple-cal-dot"></i><span>Checking</span></div>
  </div>
  <div class="apple-cal-form">
    <div class="apple-cal-field"><label for="apple-cal-url">Public iCloud calendar link</label><input id="apple-cal-url" type="text" autocomplete="off" spellcheck="false" placeholder="webcal://…icloud.com/published/…"></div>
  </div>
  <div class="apple-cal-actions"><button class="apple-cal-connect" type="button">Connect &amp; sync</button><button class="apple-cal-disconnect" type="button" hidden>Disconnect</button></div>
  <div class="apple-cal-message" aria-live="polite">In Apple Calendar, enable “Public Calendar” in the calendar’s sharing options and copy its link. Anyone with that link can read its events, so keep it private.</div>
  <div class="apple-cal-foot"><span>Link encrypted on this PC</span><span>Read-only access</span><span>30-second updates</span></div>`;

  const url = panel.querySelector('#apple-cal-url');
  const state = panel.querySelector('.apple-cal-state');
  const stateText = state.querySelector('span');
  const message = panel.querySelector('.apple-cal-message');
  const connect = panel.querySelector('.apple-cal-connect');
  const disconnect = panel.querySelector('.apple-cal-disconnect');
  const setStatus = s => {
    const connected = !!s.connected;
    state.classList.toggle('connected', connected);
    stateText.textContent = connected ? 'Connected' : 'Not connected';
    connect.textContent = connected ? 'Update calendar link' : 'Connect & sync';
    disconnect.hidden = !connected;
    if (s.error) {
      message.className = 'apple-cal-message error';
      message.textContent = s.error;
    } else if (connected) {
      message.className = 'apple-cal-message';
      const last = s.lastSync ? ' Last sync: ' + new Date(s.lastSync).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '.' : '';
      message.textContent = `Connected to your public Apple Calendar link.${last} Anyone who has this link can read its events.`;
    } else {
      message.className = 'apple-cal-message';
      message.textContent = 'In Apple Calendar, enable “Public Calendar” in the calendar’s sharing options and copy its link. Anyone with that link can read its events, so keep it private.';
    }
  };
  const busy = on => {
    connect.disabled = on;
    disconnect.disabled = on;
    connect.textContent = on ? 'Connecting…' : state.classList.contains('connected') ? 'Update calendar link' : 'Connect & sync';
  };
  connect.onclick = async () => {
    busy(true);
    message.className = 'apple-cal-message';
    message.textContent = 'Checking the public iCloud link…';
    try {
      const result = await nib.calendarConnect({ url: url.value.trim() });
      if (!result.ok) {
        message.className = 'apple-cal-message error';
        message.textContent = result.error;
        return;
      }
      url.value = '';
      setStatus(result.status);
    } catch (error) {
      message.className = 'apple-cal-message error';
      message.textContent = error.message || 'Apple Calendar connection failed.';
    } finally { busy(false); }
  };
  disconnect.onclick = async () => {
    busy(true);
    try {
      const result = await nib.calendarDisconnect();
      if (!result.ok) {
        message.className = 'apple-cal-message error';
        message.textContent = result.error;
        return;
      }
      url.value = '';
      setStatus(result.status);
    } catch (error) {
      message.className = 'apple-cal-message error';
      message.textContent = error.message || 'Could not disconnect Apple Calendar.';
    } finally { busy(false); }
  };
  nib.calendarStatus().then(setStatus).catch(error => {
    message.className = 'apple-cal-message error';
    message.textContent = error.message || 'Could not read Apple Calendar connection status.';
  });
  appleCalendarUnsubscribe = nib.onCalendarUpdate(result => {
    if (result.status) setStatus(result.status);
    if (!result.ok && result.error) {
      message.className = 'apple-cal-message error';
      message.textContent = result.error;
    }
  });
  return panel;
}
