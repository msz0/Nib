<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Nib • Eyedropper</title>
<style>
:root{font-family:'Segoe UI',system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}
body{margin:0;padding:18px;background:radial-gradient(ellipse at 100% 0%,#25233c,#11151f 70%);color:#f5f5ff;user-select:none}
header{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:16px}
.tag{font-size:10px;color:#b9a9ff;border:1px solid #675c91;border-radius:30px;padding:4px 9px}
.row{display:flex;align-items:center;gap:15px}
#swatch{width:104px;height:104px;flex:none;border-radius:16px;box-shadow:inset 0 0 0 2px #ffffff5a,0 6px 24px #0007;background:#000;transition:background .08s}
section{min-width:0;flex:1}label{font-size:11px;color:#a9b4cd;display:block;margin-bottom:6px}
#hex{font:700 23px Consolas,monospace;letter-spacing:.3px;padding:9px;border-radius:9px;color:#f7f6ff;background:#070c15;border:1px solid #48516a;white-space:nowrap}
#rgb,#coords{font-size:11px;color:#b5bed1;margin-top:8px}
button{background:#b38af2;color:#13111d;border:0;border-radius:10px;padding:12px;font-size:14px;font-weight:750;cursor:pointer;width:100%;margin-top:16px}
button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:2px solid #fff}
#status{font-size:12px;padding:9px 0;color:#d4c3ff;min-height:30px}#status.ok{color:#8ef7bb}#status.bad{color:#ffaaaa}
.hint{font-size:11px;line-height:1.5;color:#a7afc1}
</style></head><body>
<header><span>◉ Nib Eyedropper</span><span class="tag">CLICK TO LOCK</span></header>
<div class="row"><div id="swatch"></div><section><label>SELECTED HEX COLOR</label><div id="hex">—</div><div id="rgb">Select a color</div><div id="coords">Click a pixel outside this window</div></section></div>
<button id="copy" disabled>Copy HEX</button>
<div id="status" role="status" aria-live="polite">Click any desktop color to select it.</div>
<div class="hint">Click a color to lock it here. Copy when ready. Click another color to replace it.</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
let pickSeq=0,selected=null,busy=false;
function renderColor(hex){
 if(!/^#[0-9a-f]{6}$/i.test(hex))return;
 selected=hex.toUpperCase();$('hex').textContent=selected;$('swatch').style.background=selected;
 const n=parseInt(selected.slice(1),16);$('rgb').textContent=`RGB ${(n>>16)&255}, ${(n>>8)&255}, ${n&255}`;
 $('copy').disabled=false;
}
async function poll(){
 if(busy)return;busy=true;
 try {
  const s=await nib.extrasLiveColor();
  if(s && s.pickSeq && s.pickSeq!==pickSeq && s.pickedHex){
   pickSeq=s.pickSeq;renderColor(s.pickedHex);
   $('coords').textContent=`Picked at ${s.x}, ${s.y}`;
   $('status').className='';$('status').textContent='Color locked. Press Copy HEX or click another desktop color.';
  }
 } catch(e){$('status').className='bad';$('status').textContent='Eyedropper unavailable: '+String(e.message||e)}
 finally{busy=false}
}
$('copy').addEventListener('click',async()=>{
 if(!selected)return;
 const value=selected;const btn=$('copy');btn.disabled=true;
 try {
  const result=await nib.extrasCopyHex(value);
  const ok=result===true || (result && result.ok===true);
  $('status').className=ok?'ok':'bad';
  $('status').textContent=ok?`Copied ${value} to clipboard. Click another color to replace it.`:`Copy failed: ${(result&&result.error)||'Windows clipboard unavailable'}`;
 }catch(e){$('status').className='bad';$('status').textContent='Copy failed: '+String(e.message||e)}
 finally{btn.disabled=false}
});
setInterval(poll,85);poll();
</script></body></html>
