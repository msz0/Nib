<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
:root{font:13px 'Segoe UI',sans-serif;color:#f1f5fa}*{box-sizing:border-box}body,html{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
#toolbar{position:fixed;top:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid #ffffff25;border-radius:15px;background:#131923f5;box-shadow:0 10px 34px #0007;z-index:5;white-space:nowrap}
button{border:0;border-radius:9px;background:#303a4b;color:#f6f7fc;cursor:pointer;padding:8px 12px;font:600 12px 'Segoe UI'}button:hover{background:#465a75}#exit{background:#a83447}#exit:hover{background:#c4455a}input{height:30px;width:35px;border:0;background:none}#hint{font-size:11px;color:#aebcd1}
</style></head><body><canvas id="canvas"></canvas><div id="toolbar"><b>✏️ Live Draw</b><input type="color" id="color" value="#ff4757" title="Pen color"><button id="undo">Undo</button><button id="clear">Clear</button><span id="hint">Draw anywhere · Esc to exit</span><button id="exit">Exit ✕</button></div>
<script>
(()=>{'use strict';const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');const color=document.getElementById('color');let active=false,current=null,strokes=[],redo=[];
function resize(){const saved=document.createElement('canvas');saved.width=canvas.width;saved.height=canvas.height; saved.getContext('2d').drawImage(canvas,0,0);canvas.width=innerWidth;canvas.height=innerHeight;ctx.drawImage(saved,0,0)}resize();window.addEventListener('resize',resize);
function point(e){return [e.clientX,e.clientY]}function render(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const s of strokes){ctx.beginPath();ctx.strokeStyle=s.color;ctx.lineWidth=s.width;ctx.lineCap='round';ctx.lineJoin='round';s.points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(s.points.length===1){const [x,y]=s.points[0];ctx.lineTo(x+.01,y+.01)}ctx.stroke()}}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;active=true;canvas.setPointerCapture(e.pointerId);current={color:color.value,width:4,points:[point(e)]};strokes.push(current);redo=[];render()});canvas.addEventListener('pointermove',e=>{if(!active||!current)return;current.points.push(point(e));render()});function finish(){active=false;current=null}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
document.getElementById('undo').onclick=()=>{if(strokes.length)redo.push(strokes.pop());render()};document.getElementById('clear').onclick=()=>{strokes=[];redo=[];render()};document.getElementById('exit').onclick=()=>window.close();window.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();window.close()}});
})();
</script></body></html>
