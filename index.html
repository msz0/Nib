<style>
@property --bg{syntax:'<color>';inherits:true;initial-value:#000}
@property --tint{syntax:'<color>';inherits:true;initial-value:#000}
:root{--fg:#eceef3;--dim:rgba(255,255,255,.58);--c:#fff;--app:#8b93a7;--z:1;--a:1;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;color:var(--fg);font:13px/1.35 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;user-select:none;cursor:default}
button{font:600 12.5px "Segoe UI",sans-serif;color:var(--fg);border:0;cursor:pointer;background:rgba(255,255,255,.09);border-radius:14px;height:30px;padding:0 13px;transition:background .15s,transform .15s}
button:hover{background:rgba(255,255,255,.17)}button:active{transform:scale(.96)}
button.pri{background:#eceef3;color:#000}button.pri:hover{background:#fff}

/* notch */
#island{--bg:rgb(0 0 0/var(--a));--tint:var(--bg);--e:cubic-bezier(.2,1.1,.3,1);zoom:var(--z);position:absolute;top:0;left:50%;width:100px;height:28px;margin-left:-50px;
  transition:--bg .5s ease,--tint .6s ease,width .5s var(--e),height .5s var(--e),margin-left .5s var(--e),top .4s ease}
#island::before,#island::after{content:'';position:absolute;top:0;width:12px;height:12px;pointer-events:none}
#island::before{right:100%;background:radial-gradient(circle at 0 100%,transparent 11.4px,var(--bg) 12px)}
#island::after{left:100%;background:radial-gradient(circle at 100% 100%,transparent 11.4px,var(--bg) 12px)}
#island.float{top:10px}#island.float::before,#island.float::after{display:none}
#island.up{top:auto;bottom:10px}#island.up::before,#island.up::after{display:none}
#island:not(.moving):not(.locked) #rest,#island:not(.moving):not(.locked) #hdr{cursor:grab}#island.moving,#island.moving *{cursor:grabbing!important}
#clip{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--bg) 0,var(--bg) 32%,var(--tint) 100%);border-radius:0 0 14px 14px;transition:border-radius .5s var(--e)}
.float #clip{border-radius:16px}
#island.mus{width:250px;height:40px;margin-left:-125px}.mus #clip{border-radius:0 0 18px 18px}.float.mus #clip{border-radius:20px}
#island.open{width:420px;margin-left:-210px}.open #clip{border-radius:0 0 28px 28px}.float.open #clip{border-radius:28px}
#island.app{--tint:color-mix(in srgb,var(--app) 36%,#000)}

/* resting pill */
#rest{display:flex;align-items:center;justify-content:center;gap:9px;height:100%;padding:0 12px;white-space:nowrap;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
#vcAvatars{display:none;align-items:center;gap:2px;max-width:76px;overflow:hidden;flex:none}
.vc-avatar{width:17px;height:17px;flex:none;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,.55)}
.mus #vcAvatars{display:none!important}
#full,.open #rest{display:none}.open #full{display:block}
.slot{overflow:hidden;text-overflow:ellipsis;color:#fff;transition:color .4s}#L{text-align:right}#R{text-align:left}
#mini{flex:none;cursor:pointer;filter:drop-shadow(0 0 3px var(--c));animation:fin .4s ease both}#island.noeyes #mini{display:none}

#mus{display:none;align-items:center;gap:10px;width:100%}.mus #mus{display:flex}.mus #mini,.mus .slot{display:none}
#mus svg{flex:none;color:#fff}#mtx{min-width:0;text-align:left;flex:1}#m1{font-size:12px;font-weight:600;overflow:hidden}#m2{font-size:10px;color:var(--dim);overflow:hidden}
#m1,#m2{white-space:nowrap;position:relative}
.nib-music-scroll{display:inline-block;white-space:nowrap;will-change:transform}
.nib-music-scroll.is-scrolling{animation:nib-read-full-line var(--scroll-time,9s) ease-in-out infinite alternate}
@keyframes nib-read-full-line{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(calc(-1 * var(--scroll-distance,0px)))}}
@media(prefers-reduced-motion:reduce){.nib-music-scroll.is-scrolling{animation:none}#m1,#m2{overflow-x:auto;scrollbar-width:none}}


/* open layout */
#full{position:absolute;left:0;right:0;top:0;animation:fin .35s ease both}
#hdr{display:flex;align-items:center;gap:10px;height:42px;padding:6px 14px 0 16px}
#hdr .nm{font-weight:700;font-size:13px;flex:none}#hdr .dt{flex:1;display:flex;justify-content:center}
.pill{background:rgba(255,255,255,.08);border-radius:12px;padding:3px 12px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
#menu{width:28px;height:28px;padding:0;display:grid;place-items:center;background:transparent}
#pinbtn{width:28px;height:28px;padding:0;display:grid;place-items:center;background:transparent;opacity:.6;transition:opacity .15s,color .15s}#pinbtn:hover{opacity:1}
#pinbtn.on{opacity:1;color:#9fe870}#pinbtn.on svg{fill:currentColor}

#menuBox{display:none;position:absolute;right:14px;top:42px;z-index:20;width:200px;max-width:calc(100% - 28px);background:#171a22;border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:5px;box-shadow:0 12px 32px rgba(0,0,0,.55)}

#menuBox button svg{flex:none;width:16px;height:16px;opacity:.8}
#menuBox button:hover{background:rgba(255,255,255,.09)}
#menuBox .q{color:#fb8793}
#menuBox .sep{height:1px;background:rgba(255,255,255,.1);margin:4px 7px}
/* Ensure the dropdown fits, even on the shortest tab. */
#island.open:has(#menuBox.on){min-height:218px}
[data-theme="light"] #menuBox{background:#fff;border-color:#d9e1ed;box-shadow:0 10px 30px #192c4329}
[data-theme="light"] #menuBox button{color:#1d293b;background:transparent}
[data-theme="light"] #menuBox button:hover{background:#edf2f9}
[data-theme="light"] #menuBox .q{color:#b42335}
#body{padding:6px 16px 4px}#pin{max-height:236px;overflow:auto;padding:2px 0}
::-webkit-scrollbar{width:6px;height:0}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
#nav{display:flex;gap:2px;padding:6px 14px 12px;overflow-x:auto;justify-content:safe center;scrollbar-width:none}#nav::-webkit-scrollbar{display:none}#nav .nv{flex:0 0 auto}
.nv{height:32px;min-width:32px;padding:0 8px;border-radius:16px;background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;color:rgba(255,255,255,.6);flex:none}
.nv span{display:none;font-size:12px}.nv.on{background:rgba(255,255,255,.12);color:#fff}.nv.on span{display:inline}.nv:hover{color:#fff}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tl{position:relative;height:96px;border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.04),color-mix(in srgb,var(--t) 40%,#000));transition:transform .15s}.tl:hover{transform:translateY(-1px)}
.tt{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.62)}.tb{font-size:14px;font-weight:700;line-height:1.15;padding-right:34px;overflow:hidden}
.tb small{display:block;font-size:11px;font-weight:500;color:rgba(255,255,255,.65);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb.big{font-size:24px;padding-right:0}.tl .pb{position:absolute;right:9px;bottom:9px;width:30px;height:30px;border-radius:15px;background:#fff;color:#000;display:grid;place-items:center;padding:0}
.tl .art{position:absolute;right:9px;top:9px;width:36px;height:36px;border-radius:8px;object-fit:cover}.tl .tic{position:absolute;right:10px;top:9px;color:rgba(255,255,255,.55)}
.stc{border-radius:18px;padding:12px 14px;margin-bottom:8px;background:linear-gradient(180deg,rgba(255,255,255,.05),color-mix(in srgb,var(--st,#7aa2ff) 38%,#000))}
.stc b{font-size:15px}.stc .sb{color:var(--dim);font:11.5px/1.4 "Cascadia Mono",Consolas,monospace;margin:4px 0 8px;max-height:34px;overflow:hidden}.row{display:flex;gap:8px;flex-wrap:wrap}
.vc-notice{margin:8px 0;padding:8px 10px;border-radius:10px;background:rgba(88,101,242,.18);color:#e8eaff}
.vc-users{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px;max-height:116px;overflow:auto}
.vc-user{display:flex;align-items:center;gap:7px;min-width:0;padding:5px 7px;border-radius:9px;background:rgba(255,255,255,.06)}
.vc-user img{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none}
.vc-user span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--dim);font-size:12.5px}.s{height:30px;padding:0 12px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{height:72px;padding:6px 4px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:10.5px;font-weight:500;color:#cfd3dd}
.tile:hover{color:#fff}.tile img{width:24px;height:24px;object-fit:contain;filter:grayscale(1) brightness(1.25);opacity:.9}.tile b{font-size:18px}
.tile span{max-width:100%;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:center}
.zones{display:flex;flex-wrap:wrap;gap:8px}.zone{flex:1 1 100px;border:1.5px dashed rgba(255,255,255,.2);border-radius:14px;padding:12px;font-size:12px;text-align:center;transition:.15s}.zone.over{border-color:#fff;background:rgba(255,255,255,.08)}
.ev{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12.5px}.ev b{flex:none;width:84px}.ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow{display:flex;gap:12px;align-items:center}.mrow img,.mrow .noart{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:rgba(255,255,255,.08);display:grid;place-items:center}
.mt{font-size:15px;font-weight:700}.lyr{margin:10px 0 6px;min-height:66px;line-height:1.4}.lyr div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .3s}
#l0,#l2{font-size:12.5px;color:rgba(255,255,255,.4)}#l1{font-size:15px;font-weight:700;margin:2px 0}
.prog{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}.bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}.bar i{display:block;height:100%;background:#fff;width:0}
.ctl{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px}.ctl button{background:transparent;width:38px;height:34px;padding:0;display:grid;place-items:center}.ctl .big{width:44px;height:44px;border-radius:22px;background:#fff;color:#000}
.vols{display:flex;gap:6px;justify-content:center;margin-top:4px}
#clog{height:80px;overflow:auto;user-select:text;font-size:13px;line-height:1.45;margin-bottom:8px}
#inp,#ntxt{width:100%;border:0;border-radius:14px;background:rgba(255,255,255,.09);color:var(--fg);padding:0 14px;font:13px "Segoe UI",sans-serif;outline:none;user-select:text}#inp{height:34px}
#ntxt{height:118px;padding:10px 12px;resize:none;line-height:1.45}#inp::placeholder,#ntxt::placeholder{color:#7d8496}
.ntabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.ntab{flex:none;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;height:28px}.ntab.on{background:var(--app);color:#000}
.clip{display:block;width:100%;text-align:left;height:auto;min-height:30px;padding:6px 10px;margin-bottom:5px;border-radius:12px;font-weight:500;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.big2{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}.ftop{display:flex;align-items:baseline;gap:12px}
input[type=range]{width:100%;margin:12px 0 2px;accent-color:var(--app)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--dim);margin-top:8px}.dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:5px}
.meter{margin:8px 0}.meter .bar{height:8px;margin-top:5px}.meter .bar i{background:var(--app)}
svg{overflow:visible}.eye{fill:var(--c)}.hp,.xx{display:none;fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round}
/* Separate face and eye colors: the mini eyes sit on the island, the full eyes on the cat's face. */
#nib{--cat-face:#2a2f3c;--cat-ear:#2a2f3c;--cat-eyes:#f8fafc;--cat-expression:#f8fafc;--cat-nose:#c96f86}
#nib .cat-face{fill:var(--cat-face)}
#nib .cat-ear{fill:var(--cat-ear);stroke:var(--cat-face)}
#nib .cat-nose{fill:var(--cat-nose)}
#nib .eye{fill:var(--cat-eyes)}
#nib .hp,#nib .xx{stroke:var(--cat-expression)}
/* Preserve the existing requestAnimationFrame eye/blink/hop/ear animations. */
[data-theme="light"] #nib{--cat-face:#263448;--cat-ear:#263448;--cat-eyes:#fff;--cat-expression:#fff;--cat-nose:#eb8199;filter:drop-shadow(0 1px 1px rgba(15,23,42,.12))}
[data-theme="light"] #mini{filter:drop-shadow(0 0 1px rgba(15,23,42,.16))}
[data-theme="light"] #mini .eye{fill:#25364e}
#mini .eye{fill:var(--mini-eyes-custom,var(--c))}
[data-theme="light"] #mini .eye{fill:var(--mini-eyes-custom,#25364e)}
[data-theme="light"] #mini .hp,[data-theme="light"] #mini .xx{stroke:#25364e}
.v-done .hp,.v-dizzy .xx{display:inline}.v-done .eye,.v-dizzy .eye{display:none}
[data-theme="light"]{--fg:#111827;--dim:#4b5563}

[data-theme="light"] #full,[data-theme="light"] #rest{color:#132033}
[data-theme="light"] button,[data-theme="light"] .pill,[data-theme="light"] .nv{color:#132033;background:rgba(15,23,42,.07)}
[data-theme="light"] button.pri,[data-theme="light"] .ctl .big{color:#fff;background:#203653}
[data-theme="light"] .tl{background:linear-gradient(180deg,#ffffff,color-mix(in srgb,var(--t) 17%,white))}
[data-theme="light"] .tt,[data-theme="light"] .tb,[data-theme="light"] .tb small,[data-theme="light"] .tl .tic,[data-theme="light"] .nv.on,[data-theme="light"] .slot{color:#172033}
[data-theme="light"] .muted,[data-theme="light"] .legend,[data-theme="light"] #m2{color:#475569}
[data-theme="light"] #menuBox{background:#fff;color:#132033}
[data-theme="light"] #inp,[data-theme="light"] #ntxt{background:#f0f4fa;color:#132033}
[data-theme="light"] .bar{background:rgba(15,23,42,.13)}
/* Custom notch: separate from the accent. Preserve the See-through slider. */
[data-theme="custom"] #island{--bg:rgb(var(--notch-rgb,121 72 200)/var(--a));--tint:rgb(var(--notch-tint-rgb,89 42 171)/var(--a));--c:var(--notch-fg,#fff)}
[data-theme="custom"]{--fg:var(--notch-fg,#fff);--dim:var(--notch-dim,rgba(255,255,255,.68))}
[data-theme="custom"] #full,[data-theme="custom"] #rest,[data-theme="custom"] .slot{color:var(--notch-fg,#fff)}
[data-theme="custom"] #clip{background:linear-gradient(180deg,var(--bg),var(--tint))}

[data-theme="night"]{--fg:#b9c5d3;--dim:#798597}
[data-theme="night"] #clip{opacity:.86}
.memo-row{display:flex;align-items:center;gap:5px;justify-content:space-between;padding:5px 0;border-bottom:1px solid #ffffff19}.memo-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:175px}.memo-row .s{flex:none}.memo-row{flex-wrap:wrap}.memo-row span{flex:1 1 145px}.vm-select{display:flex;align-items:center;gap:5px;margin:5px 0;color:var(--dim);font-size:11px}.vm-select select{flex:1;min-width:0;max-width:260px;background:#252d3a;color:#fff;border:1px solid #46546b;border-radius:8px;padding:6px}.vm-hint{font-size:11px;color:var(--dim);margin:5px 0}.vm-error{color:#ff909d;font-size:12px}

/* Cat companion: lightweight SVG-only accessories and expressive feedback. */
#nib .cat-accessory{display:none;pointer-events:none}
#nib[data-accessory="headphones"] #cat-headphones,
#nib[data-accessory="glasses"] #cat-glasses,
#nib[data-accessory="bow"] #cat-bow,
#nib[data-accessory="crown"] #cat-crown{display:inline}
#nib .cat-accessory{stroke-linecap:round;stroke-linejoin:round}
#nib #cat-hearts{opacity:0;transition:opacity .15s;pointer-events:none}
#nib.petted #cat-hearts{opacity:1}
#nib.petted #cat-hearts path{animation:heartRise .65s ease-out both}
@keyframes heartRise{from{transform:translateY(3px);opacity:0}40%{opacity:1}to{transform:translateY(-8px);opacity:0}}
#nib .cat-sleep{display:none;font:700 12px Segoe UI,sans-serif;fill:#8bb8ea;pointer-events:none}
#nib.sleeping .cat-sleep{display:block;animation:catSleepPulse 2.4s ease-in-out infinite}
@keyframes catSleepPulse{50%{opacity:.35;transform:translateY(-3px)}}
#nib.cat-grumpy #cat-mouth{transform:translateY(2px)}
#nib.cat-playful #cat-mouth{transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){#nib #cat-hearts path,#nib .cat-sleep{animation:none!important}}

/* Custom theme: derive every island tile surface from the chosen notch color.
   Transparent white or black blends retain a consistent color across all six presets. */
[data-theme="custom"] #full .tl {
  background: linear-gradient(165deg,
    color-mix(in srgb, var(--notch-fg) 9%, var(--notch-color) 91%),
    color-mix(in srgb, var(--notch-fg) 3%, var(--notch-color) 97%));
  border: 1px solid color-mix(in srgb, var(--notch-fg) 12%, transparent);
  color: var(--notch-fg);
}
[data-theme="custom"] #full .tl:hover {
  background: color-mix(in srgb, var(--notch-fg) 14%, var(--notch-color) 86%);
}
[data-theme="custom"] #full .tt,
[data-theme="custom"] #full .tb,
[data-theme="custom"] #full .tb small,
[data-theme="custom"] #full .tl .tic,
[data-theme="custom"] #full .tile,
[data-theme="custom"] #full .tile:hover,
[data-theme="custom"] #full .stc,
[data-theme="custom"] #full .stc b { color:var(--notch-fg); }
[data-theme="custom"] #full .tb small,
[data-theme="custom"] #full .tt { opacity:.83; }
[data-theme="custom"] #full .stc {
  background:linear-gradient(160deg,
    color-mix(in srgb, var(--notch-fg) 10%, var(--notch-color) 90%),
    color-mix(in srgb, var(--notch-fg) 3%, var(--notch-color) 97%));
  border:1px solid color-mix(in srgb,var(--notch-fg) 10%, transparent);
}
[data-theme="custom"] #full .tile {
  background:color-mix(in srgb,var(--notch-fg) 8%,var(--notch-color) 92%);
  border:1px solid color-mix(in srgb,var(--notch-fg) 9%,transparent);
}
[data-theme="custom"] #full .tile:hover {background:color-mix(in srgb,var(--notch-fg) 16%,var(--notch-color) 84%)}
[data-theme="custom"] #full .nv.on {background:color-mix(in srgb,var(--notch-fg) 16%,transparent);color:var(--notch-fg)}
[data-theme="custom"] #full .tl .pb {background:var(--notch-fg);color:var(--notch-color)}


/* v0.3.8 — in-dashboard release notes */
.release-card{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 11px;margin-bottom:9px;border:1px solid color-mix(in srgb,var(--app,#a58bfa) 40%,transparent);border-radius:12px;background:linear-gradient(120deg,rgba(166,122,255,.20),rgba(89,190,255,.08));color:inherit}
.release-card b{display:block;font-size:12px;line-height:1.4}.release-card small{display:block;font-size:10px;opacity:.75;margin-top:2px}.release-view{white-space:nowrap;flex:none}
.release-page{color:inherit;max-height:325px;overflow:auto;padding:0 4px 8px;scrollbar-width:thin}
.release-head{text-align:center;padding:8px 0 11px}.release-tag{display:inline-block;padding:4px 9px;border-radius:999px;background:rgba(156,123,255,.22);font-size:10px;font-weight:700;letter-spacing:.4px}
.release-head h2{font-size:19px;line-height:1.2;margin:8px 0 4px}.release-head p{font-size:11px;opacity:.75;margin:0}
.release-items{display:grid;gap:6px}.release-item{display:flex;gap:9px;padding:9px;border-radius:10px;background:rgba(133,142,166,.12);border:1px solid rgba(140,149,175,.16)}
.release-emoji{font-size:17px;line-height:1.4;flex:none}.release-item b{display:block;font-size:12px}.release-item small{display:block;font-size:10px;opacity:.78;line-height:1.4;margin-top:3px}

// ---------- clock, focus, calendar alerts

// ---------- the eyes: white rounded squares with springy, smooth motion
const mA = $('#mA'), mB = $('#mB'), cA = $('#cA'), cB = $('#cB'), bot = $('#bot'), earL = $('#earL'), earR = $('#earR'), miniSvg = $('#mini'), nibSvg = $('#nib');
const TG = { idle: [1, 1], work: [1, .6], ask: [1.1, 1.15], focus: [1, .78], sleep: [1, .14], done: [1, 1], dizzy: [1, 1] };

}
function frame(now) {

  const personality=S.catPersonality||'friendly';
  const idleMs=clamp(Number(S.catSleepMinutes)||3,1,30)*60000;
  const sleepy=S.catSleepEnabled!==false && state==='idle' && !focusEnd && now-lastMove>idleMs;

  hopV += (-hopY * 240 - hopV * 11) * dt; hopY += hopV * dt; const sq = clamp(-hopV / 500, -.15, .15);

    if(S.catAnimations!==false && t>nextTw){twT=t;twSide=Math.random()<.5?-1:1;nextTw=t+(personality==='playful'?2:personality==='sleepy'?8:4)+Math.random()*5;}
    const e = Math.sin(clamp((t - twT) / .35, 0, 1) * Math.PI) * 14, fe = 1 - Math.exp(-dt * 12); aL += ((twSide < 0 ? -e : 0) - aL) * fe; aR += ((twSide > 0 ? e : 0) - aR) * fe;

// ---------- settings
function apply(s) {

  // Reset-position was removed from the simplified menu. Never access a missing element here.
  { const pb = $('#pinbtn'); pb.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>'; pb.classList.toggle('on', !!S.island.lock);
    pb.title = S.island.lock ? 'Pinned here. Click to unpin and move it' : 'Pin here. Drag the island anywhere, then click to lock it'; $('#hdr').title = S.island.lock ? '' : 'Drag to move'; }
